[project]
name = "hearth-index"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dbt-core>=1.10,<1.12",
    "dbt-databricks>=1.13.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
